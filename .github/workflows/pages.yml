name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify source lock
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          lock=json.loads(Path('SOURCE.json').read_text()); sha=lock.get('source_commit','')
          if lock.get('role')!='entrypoint': raise SystemExit('SOURCE.json must declare role=entrypoint')
          if len(sha)!=40 or any(c not in '0123456789abcdef' for c in sha.lower()): raise SystemExit('SOURCE.json contains an invalid source_commit')
          for name in ('index.html','PRODUCTION.md'):
              if sha not in Path(name).read_text(): raise SystemExit(f'{name} does not reference locked source commit {sha}')
          print(f'Locked upstream: {lock["source_repository"]}@{sha}')
          PY
      - name: Static contract checks
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          grep -qi '<!doctype html>' index.html
          grep -q 'PRODUCTION' index.html
          ! grep -q 'www.swpc.noaa.gov/products/aurora-30-minute-forecast' README.md
          grep -q 'www.spaceweather.gov/products/aurora-30-minute-forecast' README.md
      - name: Capture instrument figure and audit links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          npx --yes playwright@1.55.0 install --with-deps chromium
          python3 -m http.server 8000 >/tmp/geogeek-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do if curl --fail --silent http://127.0.0.1:8000/ >/dev/null; then break; fi; sleep 0.5; done
          npx --yes playwright@1.55.0 screenshot --viewport-size "1600,800" --wait-for-timeout 15000 http://127.0.0.1:8000/ assets/instrument.png
          test -s assets/instrument.png
          npm install --no-save --no-package-lock playwright@1.55.0 >/tmp/playwright-npm.log 2>&1
          cat > instrument-link-audit.cjs <<'JS'
          const { chromium, request }=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1600,height:800}});
            await page.goto('http://127.0.0.1:8000/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(12000);
            const api=await request.newContext({ignoreHTTPSErrors:true});
            const checked=new Map();
            const audit=async label=>{
              const links=await page.locator('a[href]').evaluateAll(ns=>ns.map(a=>({text:(a.textContent||'').trim().replace(/\s+/g,' ').slice(0,120),href:a.href})).filter(x=>/^https?:/i.test(x.href)));
              for(const link of links){
                if(checked.has(link.href)) continue;
                checked.set(link.href,true);
                try{const r=await api.get(link.href,{timeout:8000,failOnStatusCode:false,maxRedirects:8});console.log(`INSTRUMENT_LINK state=${label} status=${r.status()} href=${link.href} text=${JSON.stringify(link.text)}`);if(new URL(link.href).hostname==='geogeeklab.github.io'&&r.status()>=400)throw new Error(`first-party link returned ${r.status()}: ${link.href}`)}catch(e){if(new URL(link.href).hostname==='geogeeklab.github.io')throw e;console.log(`INSTRUMENT_LINK state=${label} status=ERROR href=${link.href} text=${JSON.stringify(link.text)} error=${JSON.stringify(String(e.message||e))}`)}
              }
            };
            await audit('default');
            for(const cls of ['quakes','events','aurora']){
              const button=page.locator(`.layer.${cls}`).first();
              if(!await button.count()||await button.isDisabled()){console.log(`WORLD_LAYER state=${cls} unavailable`);continue;}
              await button.click();
              await page.waitForTimeout(3000);
              const feature=page.locator(`.data.${cls} path`).first();
              if(await feature.count()){await feature.click({force:true});await page.waitForTimeout(500);}
              const hrefs=await page.locator('.inspect a[href]').evaluateAll(ns=>ns.map(a=>a.href));
              console.log(`WORLD_LAYER state=${cls} source_links=${JSON.stringify(hrefs)}`);
              if(cls==='aurora'&&hrefs.some(h=>h.includes('www.swpc.noaa.gov/products/aurora-30-minute-forecast')))throw new Error('Aurora inspector still exposes legacy SWPC product URL');
              await audit(cls);
            }
            console.log('INSTRUMENT_LINK_UNIQUE_COUNT='+checked.size);
            await api.dispose();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node instrument-link-audit.cjs
          rm -f instrument-link-audit.cjs
          rm -rf node_modules
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
