<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07100c"><title>World as Relation — GeoGeek Observatory</title><style>:root{--bg:#07100c;--paper:#f1efe7;--muted:rgba(241,239,231,.58);--line:rgba(241,239,231,.12);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--paper);font-family:var(--sans)}body{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top,.foot{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);font:700 9px/1.35 var(--mono);letter-spacing:.08em}.top a{color:inherit;text-decoration:none}.top span,.foot{color:var(--muted)}main{min-height:0;padding:10px}.stage{height:calc(100vh - 92px);min-height:620px}.instrument-loading,.instrument-error{height:100%;display:grid;place-content:center;gap:10px;text-align:center;color:var(--muted)}.instrument-error strong,.instrument-loading strong{color:var(--paper)}.foot{border-top:1px solid var(--line);border-bottom:0}@media(max-width:760px){main{padding:6px}.stage{height:auto;min-height:850px}.top,.foot{padding:12px}}</style></head><body>
<header class="top"><a href="https://geogeeklab.github.io/lab.html">GEOGEEK / OBSERVATORY</a><span>PRODUCTION RUNTIME / PINNED</span></header>
<main><div id="instrumentStage" class="stage" aria-live="polite"><div class="instrument-loading"><strong>Loading World as Relation…</strong></div></div></main>
<footer class="foot"><span>GeoGeek · Geo to see. Geek to build.</span><span>PROJECTION / DISTORTION / DATA RELATION</span></footer>
<script src="https://cdn.jsdelivr.net/gh/GeoGeekLab/GeoGeekLab.github.io@d949bd75870bfd49f6d12b297e6cca02de107f9c/site/world-projection-lab.js" crossorigin="anonymous"></script>
<script>(()=>{const stage=document.getElementById('instrumentStage'),controller=new AbortController(),runtime=window.GeoProjectionLab;const OLD_AURORA='https://www.swpc.noaa.gov/products/aurora-30-minute-forecast',NEW_AURORA='https://www.spaceweather.gov/products/aurora-30-minute-forecast';const canonicalizeLinks=()=>stage.querySelectorAll('a[href]').forEach(a=>{if(a.href===OLD_AURORA)a.href=NEW_AURORA});const linkObserver=new MutationObserver(canonicalizeLinks);linkObserver.observe(stage,{subtree:true,childList:true,attributes:true,attributeFilter:['href']});if(!runtime?.mount){stage.innerHTML='<div class="instrument-error"><strong>Projection runtime unavailable.</strong><span>The pinned production module did not initialize.</span></div>';return;}Promise.resolve(runtime.mount({stage,signal:controller.signal})).then(canonicalizeLinks).catch(error=>{stage.innerHTML=`<div class="instrument-error"><strong>Projection runtime failed.</strong><span>${String(error?.message||error)}</span></div>`});addEventListener('pagehide',()=>{linkObserver.disconnect();controller.abort()},{once:true});})();</script>
</body></html>
